name: build-wf
on:
  push:
    branches:
      - develop
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome step
        run: echo "Allah Always Help Me"
      - name: chekcout repository
        uses: actions/checkout@v4
      - name: Install Build Tool
        run: npm install --save-dev parcel
      - name: Build Website
        # run: npx parcel ./src/index.html --dist-dir dev_build
        run: npx parcel build ./src/index.html --dist-dir dev_build
      - name: Check dev_build Folder
        run: |
          cd dev_build
          ls -l
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}   # Use the GitHub token to authenticate
          publish_dir: ./dev_build  # The directory containing the built files (e.g., 'dist')
          publish_branch: gh-pages  # The branch to push the built files to (GitHub Pages will serve this branch)


