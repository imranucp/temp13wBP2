<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/temp13wBP2/">
  <title>eStore Mobile Shop</title>
  <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Welcome to Mobile eStore</h1>
      <p>Your one-stop shop for the latest smartphones and accessories.</p>
      <a href="#products" class="btn">Shop Now</a>
    </div>
  </header>
  <section id="products" class="product-section">
    <h2>Our Best Sellers</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Smartphone 1">
        <h3>Smartphone Pro</h3>
        <p>$899</p>
        <button class="btn">Buy Now</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Smartphone 2">
        <h3>Smartphone Max</h3>
        <p>$799</p>
        <button class="btn">Buy Now</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Smartphone 3">
        <h3>Smartphone Mini</h3>
        <p>$699</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 Mobile eStore | All Rights Reserved</p>
  </footer>
</body>
</html>
