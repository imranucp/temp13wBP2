<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Store</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>MobileStore</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Find Your Perfect Mobile</h2>
            <p>Latest models, unbeatable prices.</p>
            <a href="#products" class="btn">Shop Now</a>
        </div>
    </section>

    <section id="products" class="products">
        <h2>Our Featured Phones</h2>
        <div class="product-grid">
            <div class="product">
                <img src="phone1.jpg" alt="Phone 1">
                <h3>Phone Model 1</h3>
                <p>$699</p>
            </div>
            <div class="product">
                <img src="phone1.jpg" alt="Phone 2">
                <h3>Phone Model 2</h3>
                <p>$799</p>
            </div>
            <div class="product">
                <img src="phone1.jpg" alt="Phone 3">
                <h3>Phone Model 3</h3>
                <p>$899</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2025 MobileStore. All rights reserved.</p>
    </footer>
</body>
</html>
